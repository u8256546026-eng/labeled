# Сжатие ответов labeled в nginx: /etc/nginx/snippets/labeled-gzip.conf (ставит compression.sh).
# Подключается в server {} сайта labeled. Главный скрипт приложения без сжатия — 687 КБ, со сжатием ~200 КБ:
# на мобильной сети это секунды при каждом первом открытии и после выкладки. Картинки и шрифты woff2 уже сжаты.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;
