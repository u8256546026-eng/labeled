# Заголовки безопасности labeled для nginx: /etc/nginx/snippets/labeled-security.conf (ставит security-headers.sh).
# Подключается в location приложения (/ и /assets/), не в /api/ и /files/. Проверка приложения с этими
# заголовками — 06-app/scripts/check-csp.mjs.
#
# CSP: скрипты, стили-файлы, шрифты и запросы к API — только с этого адреса; встроенные style="" нужны React.
# Картинки — https: (фото товаров по ссылкам из админки), data: и blob: (предпросмотр загружаемых фото).
# frame-ancestors не задан: Telegram Web открывает Mini App во фрейме.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=()" always;
