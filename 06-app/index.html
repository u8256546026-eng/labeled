<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#C6FF00" />
    <title>labeled</title>
    <!-- Заставка до загрузки скрипта: на медленной сети вместо пустого экрана. React заменит её экраном запуска (BA). -->
    <style>
      .lb-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; background: #F7F7F5; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      .lb-splash b { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
      .lb-splash span { font-size: 13px; color: #242424; }
      .lb-splash i { width: 120px; height: 4px; margin-top: 6px; border-radius: 999px; background: linear-gradient(90deg, #E8E8E5 0%, #C6FF00 50%, #E8E8E5 100%); background-size: 200% 100%; animation: lbSplash 1.2s linear infinite; }
      @keyframes lbSplash { from { background-position: 100% 0 } to { background-position: -100% 0 } }
      @media (prefers-reduced-motion: reduce) { .lb-splash i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="lb-splash" role="status"><b>Открываем labeled</b><span>Загружаем приложение</span><i aria-hidden="true"></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
